name: NAF Alexa
on:
  push:
    branches: [main, 'v*-rc']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pdo_sqlite, readline
          coverage: none
      - run: composer validate --strict
      - run: php tools/install-test-dependencies.php
      - run: composer test
      - run: composer style:check
